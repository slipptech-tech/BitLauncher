name: Build Linux

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build BitLauncher
        run: |
          pyinstaller --onefile --name BitLauncherLinux BitLauncherLinux.py

      - name: Check executable
        run: |
          file dist/BitLauncherLinux
          chmod +x dist/BitLauncherLinux

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: BitLauncher-Linux
          path: dist/BitLauncherLinux
